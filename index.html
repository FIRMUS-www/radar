<meta name="theme-color" content="#0d1013">
<title>Content Radar</title>
<style>
:root{color-scheme:dark;--bg:#0d1013;--card:#171b1f;--line:#2b3136;--muted:#8f989f;--accent:#ff008c;--accent-soft:rgba(255,0,140,.11);--text:#f3f4f5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:18px Inter,system-ui,sans-serif}button{font:inherit}
main{max-width:1180px;margin:auto;padding:30px clamp(20px,4vw,54px) 60px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:14px}.brand h1{font-size:clamp(46px,6vw,76px);letter-spacing:-.05em;line-height:.95;margin:0}.mark{font-size:28px}
.navs{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}.nav,.btn,.feedback,.profile-tab{display:inline-flex;align-items:center;text-decoration:none;border:1px solid #343a40;border-radius:999px;padding:10px 14px;color:#fff;font-weight:850;background:#15191d;cursor:pointer}.nav:hover,.btn:hover,.feedback:hover,.feedback.active,.btn.active,.nav.active{border-color:var(--accent);color:var(--accent)}
.profilebar{margin:0 0 18px}.profile-tabs{display:flex;gap:8px;flex-wrap:wrap}.profile-tab{padding:9px 14px;font-size:14px}.profile-tab.active{background:var(--accent);border-color:var(--accent);color:#0d1013}.profile-subtitle{margin:10px 0 0;color:var(--muted);font-size:14px}
.muted{color:var(--muted);margin-bottom:24px}.list{border-top:1px solid var(--line)}.entry{border-bottom:1px solid var(--line)}.entry summary{list-style:none;cursor:pointer;padding:18px 0;display:flex;gap:18px;align-items:flex-start}.entry summary::-webkit-details-marker{display:none}.entry summary:hover .headline,.entry[open] .headline{color:var(--accent)}.entry.not-interested{opacity:.48}.entry.saved{box-shadow:inset 3px 0 0 var(--accent);padding-left:14px}.entry.seen:not([open]) .headline{color:#b7bdc2}
.rowmeta{flex:0 0 128px;padding-top:3px}.timestamp{font-size:13px;line-height:1.2;color:var(--muted);font-weight:750;white-space:nowrap;display:block}.profile-score{display:inline-flex;margin-top:7px;border:1px solid var(--accent);border-radius:999px;padding:4px 7px;font-size:10px;line-height:1;font-weight:950;letter-spacing:.04em;color:var(--accent);white-space:nowrap}.badge{display:inline-flex;margin-top:7px;border:1px solid;border-radius:999px;padding:4px 7px;font-size:10px;line-height:1;font-weight:950;letter-spacing:.04em;white-space:nowrap}.badge.hold{color:#ffd56a;border-color:#6d5a22;background:#251f0d}.badge.rejected{color:#ff9b9b;border-color:#743636;background:#2b1414}
.seenmark,.savedmark{display:block;font-size:10px;line-height:1.1;font-weight:950;letter-spacing:.05em;margin-top:7px;white-space:nowrap}.seenmark{color:var(--muted)}.savedmark{color:var(--accent)}.headline{flex:1;font-size:clamp(21px,2.3vw,31px);font-weight:800;line-height:1.25;transition:color .12s}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin:0 0 22px}.cr{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:900;margin-bottom:10px}
.context{border:1px solid #30373c;border-left:3px solid var(--accent);border-radius:14px;padding:13px 15px;margin:4px 0 12px;background:var(--accent-soft)}.context-label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:900}.context-value{margin-top:6px;line-height:1.45}.context-value strong{color:var(--accent)}
.field{padding:14px 0;border-top:1px solid #292f34}.label{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#7f8991;font-weight:850}.value{margin-top:8px;line-height:1.55}
.profile-pills,.bg-tags{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.pill,.bg-pill{border:1px solid #3a4248;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:850;color:#d9dde0}.pill.active,.bg-pill.accent{border-color:var(--accent);color:var(--accent)}
.bg-wrap{margin-top:10px}.bg-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(280px,.9fr);gap:14px;margin-top:12px}.bg-panel{background:#15191d;border:1px solid #2b3136;border-radius:16px;padding:16px}.bg-panel .field:first-child{border-top:0;padding-top:0}.bg-panel .field:last-child{padding-bottom:0}.bg-head{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:900;margin-bottom:8px}
.actions,.feedbacks{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.feedback{font-size:13px;padding:9px 12px}.feedback.active{background:var(--accent-soft)}.feedback.pending,.btn.pending{opacity:.55;pointer-events:none}.feedback-error{font-size:12px;color:#ffb0b0;margin-top:10px}.error{padding:18px;border:1px solid #763b3b;background:#2a1717;border-radius:14px;color:#ffd3d3}.empty{padding:38px 0;color:var(--muted);font-weight:700}.footer{margin-top:24px;color:#737d84;font-size:14px}
@media(max-width:840px){.bg-layout{grid-template-columns:1fr}}@media(max-width:700px){.top{display:block}.navs{justify-content:flex-start;margin-top:18px}.brand h1{font-size:44px}.entry summary{display:block;padding:18px 0}.rowmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;padding:0}.profile-score,.badge,.seenmark,.savedmark{margin-top:0}.headline{font-size:24px}.feedbacks{display:grid;grid-template-columns:1fr 1fr}.feedback{justify-content:center}.entry.saved{padding-left:10px}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand"><span class="mark">📢</span><h1>Content Radar</h1></div>
    <div class="navs"><button class="nav" id="savedFilter">🔖 Zapisane <span id="savedCount"></span></button><a class="nav" id="sourcesLink" href="sources.html">📡 Źródła CR</a></div>
  </div>
  <div class="profilebar">
    <div class="profile-tabs" id="profileTabs"></div>
    <div class="profile-subtitle" id="profileSubtitle"></div>
  </div>
  <div id="meta" class="muted">Ładowanie...</div>
  <section id="list" class="list"></section>
  <div class="footer">Content Radar · wspólny engine · osobne profile, feedy i reakcje.</div>
</main>
<script>
const PROFILES={
  bizgenerator:{key:'bizgenerator',label:'Biz Generator',short:'BG',accent:'#ff008c',subtitle:'Pomysły na biznes · dopasowanie · pierwszy klient · realny start'},
  accounting:{key:'accounting',label:'Księgowość / BIZ+',short:'KSI',accent:'#e6fa24',subtitle:'JDG · ryczałt · podatki · ZUS · KSeF · księgowość · BIZ+'}
};
const list=document.querySelector('#list'),meta=document.querySelector('#meta'),savedFilter=document.querySelector('#savedFilter'),savedCount=document.querySelector('#savedCount'),profileTabs=document.querySelector('#profileTabs'),profileSubtitle=document.querySelector('#profileSubtitle'),sourcesLink=document.querySelector('#sourcesLink');
const FEEDBACK_URL='https://oxpvuxxcskqggfqgefzg.supabase.co/functions/v1/content-radar-feedback';
const clientId=(()=>{let id=localStorage.getItem('cr_client_id');if(!id){id=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());localStorage.setItem('cr_client_id',id)}return id})();
let items=[],states={},savedOnly=false,profile=localStorage.getItem('cr_profile');
if(!PROFILES[profile])profile='bizgenerator';

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function md(s){let x=esc(s||'');x=x.replace(/\*\*(.+?)\*\*/gs,'<strong>$1</strong>');return x.replace(/\n/g,'<br>')}
function clean(t){return (t||'').replace(/^\[CONTENT\](?:\[[^\]]+\])*\s*CR-[0-9-]+\s*[\u2014-]\s*/i,'').trim()||t}
function features(i){if(!i.content_features)return{};if(typeof i.content_features==='object')return i.content_features;try{return JSON.parse(i.content_features)}catch{return{}}}
function profileKeys(i){const f=features(i),keys=Array.isArray(f.profile_keys)?f.profile_keys.filter(k=>PROFILES[k]):[];if(keys.length)return keys;if(f.bg_pillar)return ['bizgenerator'];return ['accounting']}
function belongs(i){return profileKeys(i).includes(profile)}
function profileInfo(i){const f=features(i),p=f.radar_profiles&&typeof f.radar_profiles==='object'?f.radar_profiles[profile]:null;return p&&typeof p==='object'?p:{}}
function pillar(i){const f=features(i),p=profileInfo(i);return p.pillar||(profile==='bizgenerator'?f.bg_pillar:f.accounting_pillar)||''}
function whyProfile(i){const p=profileInfo(i);return p.why||''}
function relevance(i){const p=profileInfo(i);const v=Number(p.relevance);return Number.isFinite(v)?Math.max(0,Math.min(100,Math.round(v))):null}
function field(l,v){return v?'<div class="field"><div class="label">'+esc(l)+'</div><div class="value">'+md(v)+'</div></div>':''}
function profileContext(i){const why=whyProfile(i),p=pillar(i);if(!why&&!p)return'';const label='DLACZEGO W PROFILU '+PROFILES[profile].label.toUpperCase();return '<div class="context"><div class="context-label">'+esc(label)+'</div><div class="context-value">'+(p?'<strong>'+esc(p)+'</strong>'+((why)?' · ':''):'')+md(why)+'</div></div>'}
function bgFields(i){if(profile!=='bizgenerator')return'';const f=features(i);const hasBg=Object.keys(f).some(k=>k.startsWith('bg_')||['target_person','business_model','startup_cost','startup_time','difficulty','first_customer_path','main_risk','smallest_test','product_connection','assessment_connection'].includes(k));if(!hasBg)return'';const left=[['DLA KOGO',f.target_person],['MODEL ZARABIANIA',f.business_model],['KOSZT / CZAS / TRUDNOŚĆ',[f.startup_cost,f.startup_time,f.difficulty].filter(Boolean).join(' · ')],['PIERWSZY KLIENT',f.first_customer_path]].map(([l,v])=>field(l,v)).join('');const right=[['GŁÓWNE RYZYKO',f.main_risk],['NAJMNIEJSZY TEST',f.smallest_test],['POWIĄZANIE',f.product_connection||f.assessment_connection],['NASTĘPNY RESEARCH',f.next_research]].map(([l,v])=>field(l,v)).join('');const tags=[f.bg_pillar,f.bg_series,f.startup_cost?('koszt: '+f.startup_cost):''].filter(Boolean).map((v,idx)=>'<span class="bg-pill'+(idx===0?' accent':'')+'">'+esc(v)+'</span>').join('');return '<div class="bg-wrap"><div class="bg-tags">'+tags+'</div><div class="bg-layout"><div class="bg-panel"><div class="bg-head">POTENCJAŁ I DOPASOWANIE</div>'+left+'</div><div class="bg-panel"><div class="bg-head">RYZYKO I NASTĘPNY KROK</div>'+right+'</div></div></div>'}
function profilePills(i){return '<div class="profile-pills">'+profileKeys(i).map(k=>'<span class="pill'+(k===profile?' active':'')+'">'+esc(PROFILES[k].label)+'</span>').join('')+'</div>'}
function stamp(i){const iso=i.created_at;if(!iso)return '00:00, 00.00';const p=Object.fromEntries(new Intl.DateTimeFormat('pl-PL',{timeZone:'Europe/Warsaw',hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit',hour12:false}).formatToParts(new Date(iso)).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));return p.hour+':'+p.minute+', '+p.day+'.'+p.month}
function status(i){return i.audit_status||i.fact_check_status||''}
function statusBadge(s){if(s==='HOLD')return '<span class="badge hold">⚠ HOLD</span>';if(s==='ODRZUCONE')return '<span class="badge rejected">⛔ ODRZUCONE</span>';return''}
function profileBadge(i){const r=relevance(i),text=PROFILES[profile].short+(r!==null?' '+r:'');return '<span class="profile-score">'+esc(text)+'</span>'}
function st(cr){return states[cr]||{}}
function marks(s){return (s.opened?'<span class="seenmark">✓ OTWARTE</span>':'')+(s.saved?'<span class="savedmark">🔖 ZAPISANE</span>':'')}
function feedbackButton(cr,type,label,active){return '<button class="feedback'+(active?' active':'')+'" data-cr="'+esc(cr)+'" data-feedback="'+type+'">'+label+'</button>'}
function entry(i){const s0=status(i),cr=i.cr||'',s=st(cr),cls=['entry',s.opened?'seen':'',s.saved?'saved':'',s.not_interested?'not-interested':''].filter(Boolean).join(' ');return '<details class="'+cls+'" data-cr="'+esc(cr)+'"><summary><span class="rowmeta"><span class="timestamp">'+esc(stamp(i))+'</span>'+profileBadge(i)+statusBadge(s0)+'<span class="marks">'+marks(s)+'</span></span><span class="headline">'+esc(clean(i.title))+'</span></summary><div class="card"><div class="cr">'+esc(cr||('#'+i.number))+'</div>'+profilePills(i)+profileContext(i)+field('CO SIĘ STAŁO',i.what)+field('DLACZEGO WAŻNE',i.why)+field('KĄT',i.angle)+field('HOOK',i.hook)+field('GOTOWIEC',i.ready)+bgFields(i)+'<div class="feedbacks">'+feedbackButton(cr,'more_like_this','🔥 Więcej takich',s.more_like_this)+feedbackButton(cr,'good','✓ Dobre',s.good)+feedbackButton(cr,'not_interested','✕ Nie interesuje',s.not_interested)+feedbackButton(cr,'bad_angle','👎 Zły kąt',s.bad_angle)+'</div><div class="feedback-error" hidden></div><div class="actions"><button class="btn savebtn'+(s.saved?' active':'')+'" data-cr="'+esc(cr)+'">'+(s.saved?'🔖 Zapisane':'🔖 Zapisz na później')+'</button>'+(i.source?'<a class="btn" href="'+esc(String(i.source).split(' | ')[0])+'" target="_blank" rel="noopener">Źródło ↗</a>':'')+'</div></div></details>'}
function profileItems(){return items.filter(belongs)}
function updateMeta(){const pi=profileItems(),saved=pi.filter(i=>st(i.cr).saved).length,opened=pi.filter(i=>st(i.cr).opened).length;savedCount.textContent=saved?' ('+saved+')':'';meta.textContent=pi.length+' tematów · '+opened+' otwartych · '+saved+' zapisanych · '+PROFILES[profile].label;savedFilter.classList.toggle('active',savedOnly)}
function render(){const pi=profileItems(),visible=savedOnly?pi.filter(i=>st(i.cr).saved):pi;list.innerHTML=visible.length?visible.map(entry).join(''):'<div class="empty">'+(savedOnly?'Brak zapisanych wpisów w tym profilu.':'Brak aktualnych kandydatów w tym profilu.')+'</div>';updateMeta();wire()}
function applyTheme(){const p=PROFILES[profile];document.documentElement.style.setProperty('--accent',p.accent);const rgb=p.accent==='#ff008c'?'255,0,140':'230,250,36';document.documentElement.style.setProperty('--accent-soft','rgba('+rgb+',.11)');profileSubtitle.textContent=p.subtitle;sourcesLink.href='sources.html?profile_key='+encodeURIComponent(profile);profileTabs.innerHTML=Object.values(PROFILES).map(p=>'<button class="profile-tab'+(p.key===profile?' active':'')+'" data-profile="'+p.key+'">'+esc(p.label)+'</button>').join('');document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>switchProfile(b.dataset.profile))}
async function loadStates(){states={};try{const r=await fetch(FEEDBACK_URL+'?profile_key='+encodeURIComponent(profile),{method:'GET',cache:'no-store'});if(r.ok){const body=await r.json().catch(()=>({}));if(body.ok)states=body.states||{}}}catch{}}
async function switchProfile(next){if(!PROFILES[next]||next===profile)return;profile=next;localStorage.setItem('cr_profile',profile);savedOnly=false;applyTheme();meta.textContent='Ładowanie...';list.innerHTML='';await loadStates();render()}
async function sendFeedback(cr,event_type,event_value={}){const r=await fetch(FEEDBACK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cr,profile_key:profile,event_type,event_value,client_id:clientId})});const body=await r.json().catch(()=>({}));if(!r.ok||!body.ok)throw new Error(body.error||('HTTP '+r.status));return body.state||{}}
function applyState(d,s){d.classList.toggle('seen',!!s.opened);d.classList.toggle('saved',!!s.saved);d.classList.toggle('not-interested',!!s.not_interested);const map={more_like_this:!!s.more_like_this,good:!!s.good,not_interested:!!s.not_interested,bad_angle:!!s.bad_angle};d.querySelectorAll('.feedback').forEach(b=>b.classList.toggle('active',!!map[b.dataset.feedback]));const m=d.querySelector('.marks');if(m)m.innerHTML=marks(s);const sb=d.querySelector('.savebtn');if(sb){sb.classList.toggle('active',!!s.saved);sb.textContent=s.saved?'🔖 Zapisane':'🔖 Zapisz na później'}}
function wire(){document.querySelectorAll('details.entry').forEach(d=>d.addEventListener('toggle',async()=>{const cr=d.dataset.cr;if(d.open&&!st(cr).opened){states[cr]={...st(cr),opened:true};applyState(d,st(cr));updateMeta();try{const s=await sendFeedback(cr,'opened');states[cr]={...st(cr),...s};applyState(d,st(cr));updateMeta()}catch{}}}));document.querySelectorAll('.feedback').forEach(btn=>btn.addEventListener('click',async e=>{e.preventDefault();e.stopPropagation();const d=btn.closest('.entry'),cr=btn.dataset.cr,type=btn.dataset.feedback,card=btn.closest('.card'),err=card.querySelector('.feedback-error');card.querySelectorAll('.feedback').forEach(x=>x.classList.add('pending'));err.hidden=true;try{const s=await sendFeedback(cr,type);states[cr]={...st(cr),...s};applyState(d,st(cr));updateMeta()}catch(ex){err.textContent='Nie zapisano reakcji: '+ex.message;err.hidden=false}finally{card.querySelectorAll('.feedback').forEach(x=>x.classList.remove('pending'))}}));document.querySelectorAll('.savebtn').forEach(btn=>btn.addEventListener('click',async e=>{e.preventDefault();e.stopPropagation();const d=btn.closest('.entry'),cr=btn.dataset.cr,card=btn.closest('.card'),err=card.querySelector('.feedback-error'),eventType=st(cr).saved?'unsaved':'saved';btn.classList.add('pending');err.hidden=true;try{const s=await sendFeedback(cr,eventType);states[cr]={...st(cr),...s};if(savedOnly&&eventType==='unsaved')render();else{applyState(d,st(cr));updateMeta()}}catch(ex){err.textContent='Nie zapisano wpisu: '+ex.message;err.hidden=false}finally{btn.classList.remove('pending')}}))}
savedFilter.addEventListener('click',()=>{savedOnly=!savedOnly;render()});
async function load(){applyTheme();try{const r=await fetch('/api/items',{cache:'no-store'});if(!r.ok)throw new Error('API HTTP '+r.status);items=await r.json();await loadStates();render()}catch(e){meta.textContent='';list.innerHTML='<div class="error">Nie udało się wczytać Content Radaru: '+esc(e.message)+'</div>'}}
load();
</script>
</body></html>
