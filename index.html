<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content Radar</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d1013;color:#f3f4f5;font:18px Inter,system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:30px clamp(20px,4vw,54px) 60px}.top{display:flex;justify-content:space-between;gap:18px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:14px}.brand h1{font-size:clamp(46px,6vw,76px);letter-spacing:-.05em;line-height:.95;margin:0}.nav,.btn,.fb{display:inline-flex;align-items:center;border:1px solid #343a40;border-radius:999px;padding:10px 14px;color:#fff;font-weight:850;background:#15191d;text-decoration:none;cursor:pointer}.nav:hover,.btn:hover,.fb:hover,.fb.active{border-color:#e6fa24;color:#e6fa24}.muted{color:#8f989f}.list{border-top:1px solid #2b3136}.entry{border-bottom:1px solid #2b3136}.entry.not-interested{opacity:.48}.entry summary{list-style:none;cursor:pointer;padding:18px 0;display:flex;gap:18px}.entry summary::-webkit-details-marker{display:none}.rowmeta{flex:0 0 116px}.timestamp{font-size:13px;color:#8f989f;font-weight:750}.headline{flex:1;font-size:clamp(21px,2.3vw,31px);font-weight:800;line-height:1.25}.entry[open] .headline{color:#e6fa24}.card{background:#171b1f;border:1px solid #2b3136;border-radius:18px;padding:22px;margin:0 0 22px}.cr{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#e6fa24;font-weight:900;margin-bottom:10px}.field{padding:14px 0;border-top:1px solid #292f34}.label{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#7f8991;font-weight:850}.value{margin-top:8px;line-height:1.55}.feedbacks,.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.fb{font-size:13px;padding:9px 12px}.fb.pending{opacity:.55;pointer-events:none}.err{font-size:12px;color:#ffb0b0;margin-top:10px}.footer{margin-top:24px;color:#737d84;font-size:14px}@media(max-width:700px){.top{display:block}.top>.nav{margin-top:18px}.brand h1{font-size:44px}.entry summary{display:block}.rowmeta{margin-bottom:8px}.headline{font-size:24px}.feedbacks{display:grid;grid-template-columns:1fr 1fr}.fb{justify-content:center}}</style></head><body><main><div class="top"><div class="brand"><span>📢</span><h1>Content Radar</h1></div><a class="nav" href="sources.html">📡 Źródła CR</a></div><div id="meta" class="muted">Ładowanie…</div><section id="list" class="list"></section><div class="footer">Content Radar · Supabase LIVE · wybory uczą kolejny ranking.</div></main><script>const list=document.querySelector('#list'),meta=document.querySelector('#meta'),FEEDBACK='https://oxpvuxxcskqggfqgefzg.supabase.co/functions/v1/content-radar-feedback';const cid=(()=>{let x=localStorage.getItem('cr_client_id');if(!x){x=crypto.randomUUID?crypto.randomUUID():String(Date.now());localStorage.setItem('cr_client_id',x)}return x})();const opened=new Set();function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function md(s){return esc(s||'').replace(/\*\*(.+?)\*\*/gs,'<strong>$1</strong>').replace(/\n/g,'<br>')}function clean(t){return (t||'').replace(/^\[CONTENT\](?:\[[^\]]+\])*\s*CR-[0-9-]+\s*[—-]\s*/i,'').trim()||t}function field(l,v){return v?`<div class="field"><div class="label">${l}</div><div class="value">${md(v)}</div></div>`:''}function stamp(i){const p=Object.fromEntries(new Intl.DateTimeFormat('pl-PL',{timeZone:'Europe/Warsaw',hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit',hour12:false}).formatToParts(new Date(i.created_at)).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));return `${p.hour}:${p.minute}, ${p.day}.${p.month}`}function fb(cr,t,l){return `<button class="fb" data-cr="${cr}" data-fb="${t}">${l}</button>`}function entry(i){const cr=i.cr||'';return `<details class="entry" data-cr="${cr}"><summary><span class="rowmeta"><span class="timestamp">${stamp(i)}</span></span><span class="headline">${esc(clean(i.title))}</span></summary><div class="card"><div class="cr">${esc(cr)}</div>${field('CO SIĘ STAŁO',i.what)}${field('DLACZEGO WAŻNE',i.why)}${field('KĄT',i.angle)}${field('HOOK',i.hook)}${field('GOTOWIEC',i.ready)}<div class="feedbacks">${fb(cr,'more_like_this','🔥 Więcej takich')}${fb(cr,'good','✓ Dobre')}${fb(cr,'not_interested','✕ Nie interesuje')}${fb(cr,'bad_angle','👎 Zły kąt')}</div><div class="err" hidden></div><div class="actions">${i.source?`<a class="btn" href="${esc(String(i.source).split(' | ')[0])}" target="_blank" rel="noopener">Źródło ↗</a>`:''}</div></div></details>`}async function send(cr,event_type){const r=await fetch(FEEDBACK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cr,event_type,client_id:cid})});const b=await r.json().catch(()=>({}));if(!r.ok||!b.ok)throw new Error(b.error||('HTTP '+r.status))}function wire(){document.querySelectorAll('.entry').forEach(d=>d.addEventListener('toggle',()=>{if(d.open&&!opened.has(d.dataset.cr)){opened.add(d.dataset.cr);send(d.dataset.cr,'opened').catch(()=>{})}}));document.querySelectorAll('.fb').forEach(b=>b.onclick=async e=>{e.preventDefault();const card=b.closest('.card'),err=card.querySelector('.err');card.querySelectorAll('.fb').forEach(x=>x.classList.add('pending'));err.hidden=true;try{await send(b.dataset.cr,b.dataset.fb);b.classList.add('active');if(b.dataset.fb==='not_interested')b.closest('.entry').classList.add('not-interested')}catch(x){err.textContent='Nie zapisano reakcji: '+x.message;err.hidden=false}finally{card.querySelectorAll('.fb').forEach(x=>x.classList.remove('pending'))}})}async function load(){try{const r=await fetch('/api/items',{cache:'no-store'});if(!r.ok)throw new Error('API HTTP '+r.status);const items=await r.json();meta.textContent=`${items.length} tematów · LIVE · Supabase`;list.innerHTML=items.map(entry).join('');wire()}catch(e){meta.textContent='Błąd: '+e.message}}load();</script></body></html>
