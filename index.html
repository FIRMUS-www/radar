<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content Radar</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d1013;color:#f3f4f5;font:18px Inter,system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:30px clamp(20px,4vw,54px) 60px}.top{display:flex;justify-content:space-between;gap:18px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:14px}.brand h1{font-size:clamp(46px,6vw,76px);letter-spacing:-.05em;line-height:.95;margin:0}.navs{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}.nav,.btn,.fb{display:inline-flex;align-items:center;border:1px solid #343a40;border-radius:999px;padding:10px 14px;color:#fff;font-weight:850;background:#15191d;text-decoration:none;cursor:pointer}.nav:hover,.btn:hover,.fb:hover,.fb.active,.btn.active,.nav.active{border-color:#e6fa24;color:#e6fa24}.muted{color:#8f989f;margin-bottom:24px}.list{border-top:1px solid #2b3136}.entry{border-bottom:1px solid #2b3136}.entry.not-interested{opacity:.48}.entry.saved{box-shadow:inset 3px 0 0 #e6fa24;padding-left:14px}.entry summary{list-style:none;cursor:pointer;padding:18px 0;display:flex;gap:18px}.entry summary::-webkit-details-marker{display:none}.rowmeta{flex:0 0 116px}.timestamp{font-size:13px;color:#8f989f;font-weight:750;display:block}.seenmark,.savedmark{display:block;font-size:10px;letter-spacing:.07em;font-weight:900;margin-top:5px}.seenmark{color:#8f989f}.savedmark{color:#e6fa24}.headline{flex:1;font-size:clamp(21px,2.3vw,31px);font-weight:800;line-height:1.25}.entry.seen:not([open]) .headline{color:#b7bdc2}.entry[open] .headline{color:#e6fa24}.card{background:#171b1f;border:1px solid #2b3136;border-radius:18px;padding:22px;margin:0 0 22px}.cr{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#e6fa24;font-weight:900;margin-bottom:10px}.field{padding:14px 0;border-top:1px solid #292f34}.label{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#7f8991;font-weight:850}.value{margin-top:8px;line-height:1.55}.feedbacks,.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.fb{font-size:13px;padding:9px 12px}.fb.pending,.btn.pending{opacity:.55;pointer-events:none}.err{font-size:12px;color:#ffb0b0;margin-top:10px}.footer{margin-top:24px;color:#737d84;font-size:14px}.empty{padding:38px 0;color:#8f989f;font-weight:700}@media(max-width:700px){.top{display:block}.navs{justify-content:flex-start;margin-top:18px}.brand h1{font-size:44px}.entry summary{display:block}.rowmeta{margin-bottom:8px}.headline{font-size:24px}.feedbacks{display:grid;grid-template-columns:1fr 1fr}.fb{justify-content:center}.entry.saved{padding-left:10px}}</style></head><body><main><div class="top"><div class="brand"><span>📢</span><h1>Content Radar</h1></div><div class="navs"><button class="nav" id="savedFilter">🔖 Zapisane <span id="savedCount"></span></button><a class="nav" href="sources.html">📡 Źródła CR</a></div></div><div id="meta" class="muted">Ładowanie...</div><section id="list" class="list"></section><div class="footer">Content Radar · Supabase LIVE · otwarcia, oceny i zapisane wpisy są trwałe.</div></main><script>const list=document.querySelector('#list'),meta=document.querySelector('#meta'),savedFilter=document.querySelector('#savedFilter'),savedCount=document.querySelector('#savedCount'),FEEDBACK='https://oxpvuxxcskqggfqgefzg.supabase.co/functions/v1/content-radar-feedback';const cid=(()=>{let x=localStorage.getItem('cr_client_id');if(!x){x=crypto.randomUUID?crypto.randomUUID():String(Date.now());localStorage.setItem('cr_client_id',x)}return x})();let items=[],states={},savedOnly=false;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function md(s){return esc(s||'').replace(/\*\*(.+?)\*\*/gs,'<strong>$1</strong>').replace(/\n/g,'<br>')}function clean(t){return (t||'').replace(/^\[CONTENT\](?:\[[^\]]+\])*\s*CR-[0-9-]+\s*[\u2014-]\s*/i,'').trim()||t}function field(l,v){return v?`<div class="field"><div class="label">${l}</div><div class="value">${md(v)}</div></div>`:''}function stamp(i){const p=Object.fromEntries(new Intl.DateTimeFormat('pl-PL',{timeZone:'Europe/Warsaw',hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit',hour12:false}).formatToParts(new Date(i.created_at)).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));return `${p.hour}:${p.minute}, ${p.day}.${p.month}`}function st(cr){return states[cr]||{}}function fb(cr,t,l,a){return `<button class="fb${a?' active':''}" data-cr="${cr}" data-fb="${t}">${l}</button>`}function marks(s){return `${s.opened?'<span class="seenmark">✓ OTWARTE</span>':''}${s.saved?'<span class="savedmark">🔖 ZAPISANE</span>':''}`}function entry(i){const cr=i.cr||'',s=st(cr),cls=['entry',s.opened?'seen':'',s.saved?'saved':'',s.not_interested?'not-interested':''].filter(Boolean).join(' ');return `<details class="${cls}" data-cr="${cr}"><summary><span class="rowmeta"><span class="timestamp">${stamp(i)}</span><span class="marks">${marks(s)}</span></span><span class="headline">${esc(clean(i.title))}</span></summary><div class="card"><div class="cr">${esc(cr)}</div>${field('CO SIĘ STAŁO',i.what)}${field('DLACZEGO WAŻNE',i.why)}${field('KĄT',i.angle)}${field('HOOK',i.hook)}${field('GOTOWIEC',i.ready)}<div class="feedbacks">${fb(cr,'more_like_this','🔥 Więcej takich',s.more_like_this)}${fb(cr,'good','✓ Dobre',s.good)}${fb(cr,'not_interested','✕ Nie interesuje',s.not_interested)}${fb(cr,'bad_angle','👎 Zły kąt',s.bad_angle)}</div><div class="err" hidden></div><div class="actions"><button class="btn savebtn${s.saved?' active':''}" data-cr="${cr}">${s.saved?'🔖 Zapisane':'🔖 Zapisz na później'}</button>${i.source?`<a class="btn" href="${esc(String(i.source).split(' | ')[0])}" target="_blank" rel="noopener">Źródło ↗</a>`:''}</div></div></details>`}function updateMeta(){const saved=items.filter(i=>st(i.cr).saved).length,opened=items.filter(i=>st(i.cr).opened).length;savedCount.textContent=saved?`(${saved})`:'';meta.textContent=`${items.length} tematów · ${opened} otwartych · ${saved} zapisanych · LIVE · Supabase`;savedFilter.classList.toggle('active',savedOnly)}function render(){const visible=savedOnly?items.filter(i=>st(i.cr).saved):items;list.innerHTML=visible.length?visible.map(entry).join(''):'<div class="empty">Brak zapisanych wpisów.</div>';updateMeta();wire()}async function send(cr,event_type){const r=await fetch(FEEDBACK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cr,event_type,client_id:cid})});const b=await r.json().catch(()=>({}));if(!r.ok||!b.ok)throw new Error(b.error||('HTTP '+r.status));return b.state||{}}function apply(d,s){d.classList.toggle('seen',!!s.opened);d.classList.toggle('saved',!!s.saved);d.classList.toggle('not-interested',!!s.not_interested);const map={more_like_this:!!s.more_like_this,good:!!s.good,not_interested:!!s.not_interested,bad_angle:!!s.bad_angle};d.querySelectorAll('.fb').forEach(b=>b.classList.toggle('active',!!map[b.dataset.fb]));const m=d.querySelector('.marks');if(m)m.innerHTML=marks(s);const sb=d.querySelector('.savebtn');if(sb){sb.classList.toggle('active',!!s.saved);sb.textContent=s.saved?'🔖 Zapisane':'🔖 Zapisz na później'}}function wire(){document.querySelectorAll('.entry').forEach(d=>d.addEventListener('toggle',async()=>{const cr=d.dataset.cr;if(d.open&&!st(cr).opened){states[cr]={...st(cr),opened:true};apply(d,st(cr));updateMeta();try{const s=await send(cr,'opened');states[cr]={...st(cr),...s};apply(d,st(cr));updateMeta()}catch{}}}));document.querySelectorAll('.fb').forEach(b=>b.onclick=async e=>{e.preventDefault();const d=b.closest('.entry'),card=b.closest('.card'),err=card.querySelector('.err');card.querySelectorAll('.fb').forEach(x=>x.classList.add('pending'));err.hidden=true;try{const s=await send(b.dataset.cr,b.dataset.fb);states[b.dataset.cr]={...st(b.dataset.cr),...s};apply(d,st(b.dataset.cr));updateMeta()}catch(x){err.textContent='Nie zapisano reakcji: '+x.message;err.hidden=false}finally{card.querySelectorAll('.fb').forEach(x=>x.classList.remove('pending'))}});document.querySelectorAll('.savebtn').forEach(b=>b.onclick=async e=>{e.preventDefault();const d=b.closest('.entry'),card=b.closest('.card'),err=card.querySelector('.err'),cr=b.dataset.cr,ev=st(cr).saved?'unsaved':'saved';b.classList.add('pending');err.hidden=true;try{const s=await send(cr,ev);states[cr]={...st(cr),...s};if(savedOnly&&ev==='unsaved'){render()}else{apply(d,st(cr));updateMeta()}}catch(x){err.textContent='Nie zapisano wpisu: '+x.message;err.hidden=false}finally{b.classList.remove('pending')}})}savedFilter.onclick=()=>{savedOnly=!savedOnly;render()};async function load(){try{const r=await fetch('/api/items',{cache:'no-store'});if(!r.ok)throw new Error('API HTTP '+r.status);items=await r.json();try{const sr=await fetch(FEEDBACK,{method:'GET',cache:'no-store'});const sb=await sr.json();if(sr.ok&&sb.ok)states=sb.states||{}}catch{}render()}catch(e){meta.textContent='Błąd: '+e.message}}load();</script></body></html>
