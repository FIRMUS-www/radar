<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Content Radar</title>
<style>
:root{color-scheme:dark;--bg:#0d1013;--card:#171b1f;--line:#2b3136;--muted:#8f989f;--accent:#e6fa24;--text:#f3f4f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:18px Inter,system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:30px clamp(20px,4vw,54px) 60px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:14px}.brand h1{font-size:clamp(46px,6vw,76px);letter-spacing:-.05em;line-height:.95;margin:0}.mark{font-size:28px}.navs{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}.nav,.btn,.feedback{display:inline-flex;align-items:center;text-decoration:none;border:1px solid #343a40;border-radius:999px;padding:10px 14px;color:#fff;font-weight:850;background:#15191d;cursor:pointer}.nav:hover,.btn:hover,.feedback:hover,.feedback.active,.btn.active,.nav.active{border-color:var(--accent);color:var(--accent)}.muted{color:var(--muted);margin-bottom:24px}.list{border-top:1px solid var(--line)}.entry{border-bottom:1px solid var(--line)}.entry summary{list-style:none;cursor:pointer;padding:18px 0;display:flex;gap:18px;align-items:flex-start}.entry summary::-webkit-details-marker{display:none}.entry summary:hover .headline,.entry[open] .headline{color:var(--accent)}.entry.not-interested{opacity:.48}.entry.saved{box-shadow:inset 3px 0 0 var(--accent);padding-left:14px}.entry.seen:not([open]) .headline{color:#b7bdc2}.rowmeta{flex:0 0 116px;padding-top:3px}.timestamp{font-size:13px;line-height:1.2;color:var(--muted);font-weight:750;white-space:nowrap;display:block}.badge{display:inline-flex;margin-top:7px;border:1px solid;border-radius:999px;padding:4px 7px;font-size:10px;line-height:1;font-weight:950;letter-spacing:.04em;white-space:nowrap}.badge.hold{color:#ffd56a;border-color:#6d5a22;background:#251f0d}.badge.rejected{color:#ff9b9b;border-color:#743636;background:#2b1414}.seenmark,.savedmark{display:block;font-size:10px;line-height:1.1;font-weight:950;letter-spacing:.05em;margin-top:7px;white-space:nowrap}.seenmark{color:var(--muted)}.savedmark{color:var(--accent)}.headline{flex:1;font-size:clamp(21px,2.3vw,31px);font-weight:800;line-height:1.25;transition:color .12s}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin:0 0 22px}.cr{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:900;margin-bottom:10px}.score{font-size:12px;color:var(--muted);margin-bottom:8px}.field{padding:14px 0;border-top:1px solid #292f34}.label{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#7f8991;font-weight:850}.value{margin-top:8px;line-height:1.55}.actions,.feedbacks{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.feedback{font-size:13px;padding:9px 12px}.feedback.active{background:#20270c}.feedback.pending,.btn.pending{opacity:.55;pointer-events:none}.feedback-error{font-size:12px;color:#ffb0b0;margin-top:10px}.error{padding:18px;border:1px solid #763b3b;background:#2a1717;border-radius:14px;color:#ffd3d3}.empty{padding:38px 0;color:var(--muted);font-weight:700}.footer{margin-top:24px;color:#737d84;font-size:14px}@media(max-width:700px){.top{display:block}.navs{justify-content:flex-start;margin-top:18px}.brand h1{font-size:44px}.entry summary{display:block;padding:18px 0}.rowmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;padding:0}.badge,.seenmark,.savedmark{margin-top:0}.headline{font-size:24px}.feedbacks{display:grid;grid-template-columns:1fr 1fr}.feedback{justify-content:center}.entry.saved{padding-left:10px}}
</style>
</head>
<body>
<main>
  <div class="top"><div class="brand"><span class="mark">📢</span><h1>Content Radar</h1></div><div class="navs"><button class="nav" id="savedFilter">🔖 Zapisane <span id="savedCount"></span></button><a class="nav" href="sources.html">📡 Źródła CR</a></div></div>
  <div id="meta" class="muted">Ładowanie...</div>
  <section id="list" class="list"></section>
  <div class="footer">Content Radar · Supabase LIVE · otwarcia, oceny i zapisane wpisy są trwałe.</div>
</main>
<script>
const list=document.querySelector('#list'),meta=document.querySelector('#meta'),savedFilter=document.querySelector('#savedFilter'),savedCount=document.querySelector('#savedCount');
const FEEDBACK_URL='https://oxpvuxxcskqggfqgefzg.supabase.co/functions/v1/content-radar-feedback';
const clientId=(()=>{let id=localStorage.getItem('cr_client_id');if(!id){id=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());localStorage.setItem('cr_client_id',id)}return id})();
let items=[],states={},savedOnly=false;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function md(s){let x=esc(s||'');x=x.replace(/\*\*(.+?)\*\*/gs,'<strong>$1</strong>');return x.replace(/\n/g,'<br>')}
function clean(t){return (t||'').replace(/^\[CONTENT\](?:\[[^\]]+\])*\s*CR-[0-9-]+\s*[\u2014-]\s*/i,'').trim()||t}
function field(l,v){return v?`<div class="field"><div class="label">${l}</div><div class="value">${md(v)}</div></div>`:''}
function stamp(i){const iso=i.created_at;if(!iso)return '00:00, 00.00';const p=Object.fromEntries(new Intl.DateTimeFormat('pl-PL',{timeZone:'Europe/Warsaw',hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit',hour12:false}).formatToParts(new Date(iso)).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));return `${p.hour}:${p.minute}, ${p.day}.${p.month}`}
function status(i){return i.audit_status||i.fact_check_status||''}
function badge(s){if(s==='HOLD')return '<span class="badge hold">⚠ HOLD</span>';if(s==='ODRZUCONE')return '<span class="badge rejected">⛔ ODRZUCONE</span>';return ''}
function score(i){const bits=[];if(i.content_score!=null)bits.push('content '+Number(i.content_score).toFixed(0));if(i.fit_score!=null)bits.push('fit '+Number(i.fit_score).toFixed(0));if(i.final_score!=null)bits.push('ranking '+Number(i.final_score).toFixed(0));return bits.length?`<div class="score">${bits.join(' · ')}</div>`:''}
function st(cr){return states[cr]||{}}
function marks(s){return `${s.opened?'<span class="seenmark">✓ OTWARTE</span>':''}${s.saved?'<span class="savedmark">🔖 ZAPISANE</span>':''}`}
function feedbackButton(cr,type,label,active){return `<button class="feedback${active?' active':''}" data-cr="${esc(cr)}" data-feedback="${type}">${label}</button>`}
function entry(i){const s0=status(i),cr=i.cr||'',s=st(cr),cls=['entry',s.opened?'seen':'',s.saved?'saved':'',s.not_interested?'not-interested':''].filter(Boolean).join(' ');return `<details class="${cls}" data-cr="${esc(cr)}"><summary><span class="rowmeta"><span class="timestamp">${esc(stamp(i))}</span>${badge(s0)}<span class="marks">${marks(s)}</span></span><span class="headline">${esc(clean(i.title))}</span></summary><div class="card"><div class="cr">${esc(cr||'#'+i.number)}</div>${score(i)}${field('CO SIĘ STAŁO',i.what)}${field('DLACZEGO WAŻNE',i.why)}${field('KĄT',i.angle)}${field('HOOK',i.hook)}${field('GOTOWIEC',i.ready)}<div class="feedbacks">${feedbackButton(cr,'more_like_this','🔥 Więcej takich',s.more_like_this)}${feedbackButton(cr,'good','✓ Dobre',s.good)}${feedbackButton(cr,'not_interested','✕ Nie interesuje',s.not_interested)}${feedbackButton(cr,'bad_angle','👎 Zły kąt',s.bad_angle)}</div><div class="feedback-error" hidden></div><div class="actions"><button class="btn savebtn${s.saved?' active':''}" data-cr="${esc(cr)}">${s.saved?'🔖 Zapisane':'🔖 Zapisz na później'}</button>${i.source?`<a class="btn" href="${esc(String(i.source).split(' | ')[0])}" target="_blank" rel="noopener">Źródło ↗</a>`:''}</div></div></details>`}
function updateMeta(){const saved=items.filter(i=>st(i.cr).saved).length,opened=items.filter(i=>st(i.cr).opened).length;savedCount.textContent=saved?`(${saved})`:'';meta.textContent=`${items.length} tematów · ${opened} otwartych · ${saved} zapisanych · LIVE · Supabase`;savedFilter.classList.toggle('active',savedOnly)}
function render(){const visible=savedOnly?items.filter(i=>st(i.cr).saved):items;list.innerHTML=visible.length?visible.map(entry).join(''):'<div class="empty">Brak zapisanych wpisów.</div>';updateMeta();wire()}
async function sendFeedback(cr,event_type,event_value={}){const r=await fetch(FEEDBACK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cr,event_type,event_value,client_id:clientId})});const body=await r.json().catch(()=>({}));if(!r.ok||!body.ok)throw new Error(body.error||('HTTP '+r.status));return body.state||{}}
function applyState(d,s){d.classList.toggle('seen',!!s.opened);d.classList.toggle('saved',!!s.saved);d.classList.toggle('not-interested',!!s.not_interested);const map={more_like_this:!!s.more_like_this,good:!!s.good,not_interested:!!s.not_interested,bad_angle:!!s.bad_angle};d.querySelectorAll('.feedback').forEach(b=>b.classList.toggle('active',!!map[b.dataset.feedback]));const m=d.querySelector('.marks');if(m)m.innerHTML=marks(s);const sb=d.querySelector('.savebtn');if(sb){sb.classList.toggle('active',!!s.saved);sb.textContent=s.saved?'🔖 Zapisane':'🔖 Zapisz na później'}}
function wire(){document.querySelectorAll('details.entry').forEach(d=>d.addEventListener('toggle',async()=>{const cr=d.dataset.cr;if(d.open&&!st(cr).opened){states[cr]={...st(cr),opened:true};applyState(d,st(cr));updateMeta();try{const s=await sendFeedback(cr,'opened');states[cr]={...st(cr),...s};applyState(d,st(cr));updateMeta()}catch{}}}));document.querySelectorAll('.feedback').forEach(btn=>btn.addEventListener('click',async e=>{e.preventDefault();e.stopPropagation();const d=btn.closest('.entry'),cr=btn.dataset.cr,type=btn.dataset.feedback,card=btn.closest('.card'),err=card.querySelector('.feedback-error');card.querySelectorAll('.feedback').forEach(x=>x.classList.add('pending'));err.hidden=true;try{const s=await sendFeedback(cr,type);states[cr]={...st(cr),...s};applyState(d,st(cr));updateMeta()}catch(ex){err.textContent='Nie zapisano reakcji: '+ex.message;err.hidden=false}finally{card.querySelectorAll('.feedback').forEach(x=>x.classList.remove('pending'))}}));document.querySelectorAll('.savebtn').forEach(btn=>btn.addEventListener('click',async e=>{e.preventDefault();e.stopPropagation();const d=btn.closest('.entry'),cr=btn.dataset.cr,card=btn.closest('.card'),err=card.querySelector('.feedback-error'),eventType=st(cr).saved?'unsaved':'saved';btn.classList.add('pending');err.hidden=true;try{const s=await sendFeedback(cr,eventType);states[cr]={...st(cr),...s};if(savedOnly&&eventType==='unsaved')render();else{applyState(d,st(cr));updateMeta()}}catch(ex){err.textContent='Nie zapisano wpisu: '+ex.message;err.hidden=false}finally{btn.classList.remove('pending')}}))}
savedFilter.addEventListener('click',()=>{savedOnly=!savedOnly;render()});
async function load(){try{const [itemsResp,stateResp]=await Promise.all([fetch('/api/items',{cache:'no-store'}),fetch(FEEDBACK_URL,{method:'GET',cache:'no-store'})]);if(!itemsResp.ok)throw new Error('API HTTP '+itemsResp.status);items=await itemsResp.json();if(stateResp.ok){const body=await stateResp.json().catch(()=>({}));if(body.ok)states=body.states||{}}render()}catch(e){meta.textContent='';list.innerHTML='<div class="error">Nie udało się wczytać Content Radaru: '+esc(e.message)+'</div>'}}
load();
</script>
</body></html>
