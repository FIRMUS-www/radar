<meta name="theme-color" content="#0d1013">
<title>Content Radar</title>
<style>
:root{color-scheme:dark;--bg:#0d1013;--card:#171b1f;--border:#31383d;--muted:#a2aaaf;--accent:#ffd700;--text:#f2f3f5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:1050px;margin:auto;padding:32px clamp(18px,4vw,48px) 90px}
a{color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;gap:20px}
.header-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.sync-trigger{font:inherit;background:transparent;cursor:pointer}
.deleted-trigger{font:inherit;background:transparent;cursor:pointer}
.deleted-trigger[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.sync-panel{margin-top:18px;padding:16px;border:1px solid var(--border);border-radius:14px;background:#191d20}
.sync-panel[hidden]{display:none}
.sync-panel p{margin:8px 0;color:var(--muted);font-size:14px}
.sync-panel small{color:var(--muted);font-size:12px}
.sync-head,.sync-link-row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.sync-link-row{margin:12px 0}
.sync-invite{flex:1;min-width:0;background:#0d1013;border:1px solid var(--border);color:var(--text);font:inherit;padding:9px;border-radius:8px}
@media(max-width:640px){.header-actions{gap:5px}.sync-trigger{font-size:13px}.sync-link-row{flex-wrap:wrap}.sync-invite{flex-basis:100%}}

h1{font-size:clamp(36px,5vw,64px);line-height:1.04;letter-spacing:-.05em;margin:0}
.source-link{white-space:nowrap;text-decoration:none;border-bottom:1px solid var(--border);color:#e0e4e7;padding:8px}
button{font:inherit;cursor:pointer}
.control,.action{border:1px solid var(--border);background:#171b1f;color:#e5e8ea;border-radius:999px;padding:9px 14px}
.control:hover,.action:hover{border-color:var(--accent)}
.search{display:block;margin-top:26px;min-width:230px;flex:1;background:#111519;color:var(--text);border:1px solid var(--border);border-radius:999px;padding:10px 16px;font:inherit}
.search:focus{outline:2px solid #b29c15;outline-offset:2px}
.meta{font-size:13px;color:var(--muted);min-height:24px;margin:18px 0}
.message{padding:20px 0 23px;border-top:1px solid var(--border)}
.message-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:650;margin-bottom:8px}
.message h2{font-size:clamp(20px,2.5vw,27px);line-height:1.28;letter-spacing:-.02em;margin:0 0 9px}
.message h2 a{text-decoration:none}
.message h2 a:hover{color:var(--accent)}
.excerpt{font-size:15px;color:#c4cbd0;margin:0 0 13px;white-space:normal;overflow-wrap:anywhere}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.action{font-size:13px;padding:7px 12px}
.action.saved{border-color:var(--accent);color:var(--accent)}
.count{color:var(--muted)}
.empty{padding:40px 0;color:var(--muted);border-top:1px solid var(--border)}
.error{border:1px solid #864949;background:#301a1a;color:#ffd3d3;border-radius:12px;padding:15px}
.more{margin-top:22px}
.note{margin-top:24px;color:var(--muted);font-size:12px}
@media(max-width:640px){.top{align-items:flex-start;flex-wrap:wrap}.header-actions{justify-content:flex-start}.source-link{font-size:13px}.search{width:100%;flex-basis:100%}.toolbar{gap:7px}.control{padding:8px 11px}}

.action.prepare{border-color:#897a2f;color:#ffe88d}
.action[disabled]{opacity:.48;cursor:wait}
.brief{margin-top:15px;padding:16px 18px;background:#191d20;border:1px solid #4a4226;border-left:3px solid var(--accent);border-radius:12px}
.brief-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.brief-code{color:var(--accent);font-weight:850;letter-spacing:.04em;font-size:16px}
.brief p{margin:8px 0;color:#e0e4e7}
.brief small{color:var(--muted)}
.brief-error{margin:12px 0;color:#ffbaba;font-size:13px}
.brief-link{display:inline-block;margin-top:7px;color:var(--accent);font-weight:650}

</style>
</head>
<body>

<main>
  <header class="top"><h1>Content Radar<span style="color:var(--accent)">.</span></h1><nav class="header-actions" aria-label="Opcje"><button class="source-link deleted-trigger" type="button" id="deletedToggle" aria-pressed="false">Usunięte</button><button class="source-link sync-trigger" type="button" id="syncLink">Połącz telefon</button><a class="source-link" href="sources.html">Źródła ↗</a></nav></header>
  <section id="syncPanel" class="sync-panel" hidden aria-label="Synchronizacja urządzeń">
    <div class="sync-head"><strong>Synchronizacja urządzeń</strong><button id="syncClose" type="button" class="action">Zamknij</button></div>
    <p>Skopiuj link i otwórz go raz na Androidzie. Oba urządzenia będą wtedy pokazywać te same ukryte i zapisane wiadomości.</p>
    <div class="sync-link-row"><input id="syncInvite" class="sync-invite" type="text" readonly aria-label="Prywatny link do połączenia telefonu"><button id="syncCopy" type="button" class="action">Kopiuj link</button></div>
    <small id="syncInfo">Nie udostępniaj linku innym osobom — zapewnia dostęp do Twojej listy.</small>
  </section>
  <input class="search" id="search" type="search" placeholder="Szukaj w tytułach i fragmentach…" autocomplete="off" aria-label="Szukaj w wiadomościach">
  <div class="meta" id="meta" role="status">Ładowanie wiadomości…</div>
  <section id="messages" aria-label="Lista wiadomości"></section>
  <button id="more" class="control more" type="button" hidden>Pokaż kolejne</button>
</main>

<script>

'use strict';
const API='/api/items';
const IDEA_RPC='https://oxpvuxxcskqggfqgefzg.supabase.co/rest/v1/rpc/content_radar_enqueue_idea';
const IDEA_API_KEY='sb_publishable_DpiuTMhpgVFfiY4O9mm0nw_HNhxmfqV';
const STORAGE_HIDDEN='cr_feed_hidden_v1';
const STORAGE_SAVED='cr_feed_saved_v1';
const STORAGE_PREPARED='cr_feed_prepared_v1';
const STORAGE_SYNC='cr_feed_sync_token_v1';
const STORAGE_PENDING='cr_feed_sync_pending_v1';
const SYNC_PATTERN=/^[0-9a-f]{64}$/;
const SYNC_ID=/^[1-9][0-9]{0,11}$/;
const messages=document.querySelector('#messages');
const meta=document.querySelector('#meta');
const more=document.querySelector('#more');
const deletedToggle=document.querySelector('#deletedToggle');
const syncLink=document.querySelector('#syncLink');
const syncPanel=document.querySelector('#syncPanel');
const syncInvite=document.querySelector('#syncInvite');
const syncCopy=document.querySelector('#syncCopy');
const syncClose=document.querySelector('#syncClose');
const syncInfo=document.querySelector('#syncInfo');
const search=document.querySelector('#search');
let articles=[],pageSize=80,hidden=readSet(STORAGE_HIDDEN),saved=readSet(STORAGE_SAVED),fetching=false,deletedView=false;
let prepared=readPrepared(),expanded=new Set(Object.keys(prepared)),preparing=new Set(),prepareErrors={};
let ideasQueued=new Set(),ideasQueueing=new Set();
let syncToken=readSyncToken(),syncPending=readPending(),syncBusy=false,syncConnecting=false;

function readSyncToken(){try{const t=localStorage.getItem(STORAGE_SYNC);return SYNC_PATTERN.test(t||'')?t:null}catch{return null}}
function readPending(){try{
 const a=JSON.parse(localStorage.getItem(STORAGE_PENDING)||'[]');
 return Array.isArray(a)?a.filter(x=>x&&['hidden','saved'].includes(x.kind)&&SYNC_ID.test(x.id)&&typeof x.enabled==='boolean').slice(-10000):[];
}catch{return []}}
function storePending(){try{localStorage.setItem(STORAGE_PENDING,JSON.stringify(syncPending))}catch{syncInfo.textContent='Nie można zapisać kolejki synchronizacji w przeglądarce.'}}
function syncUi(){syncLink.textContent=syncToken?'✓ Synchronizacja':'Połącz telefon';if(syncToken)syncInvite.value='https://zarzad-radar.vercel.app/#cr-sync='+syncToken}
function applyRemote(data){
 if(!data||!Array.isArray(data.hidden)||!Array.isArray(data.saved))throw Error('Błędna odpowiedź synchronizacji.');
 const h=data.hidden.map(String),s=data.saved.map(String);
 if(h.some(x=>!SYNC_ID.test(x))||s.some(x=>!SYNC_ID.test(x)))throw Error('Błędny stan synchronizacji.');
 hidden=new Set(h);saved=new Set(s);
 storeSet(STORAGE_HIDDEN,hidden);
 storeSet(STORAGE_SAVED,saved);
 render();
}
async function syncRequest(body){
 const response=await fetch('/api/sync',{
  method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify(body),cache:'no-store'
 });
 const data=await response.json().catch(function(){return {}});
 if(!response.ok)throw Error('Brak połączenia z synchronizacją (HTTP '+response.status+').');
 return data;
}
function enqueueSync(kind,id,enabled){
 if(!syncToken)return;
 syncPending=syncPending.filter(x=>!(x.kind===kind&&x.id===id));
 syncPending.push({kind,id,enabled});
 storePending();
 pullSync();
}
async function pullSync(){
 if(!syncToken||syncBusy||syncConnecting)return;
 syncBusy=true;
 try{
  while(syncPending.length){
   const action=syncPending[0];
   await syncRequest({op:'change',token:syncToken,kind:action.kind,id:action.id,enabled:action.enabled});
   if(syncPending[0]===action)syncPending.shift();
   else syncPending=syncPending.filter(x=>x!==action);
   storePending();
  }
  const remote=await syncRequest({op:'get',token:syncToken});
  if(!syncPending.length)applyRemote(remote);
  syncInfo.textContent='Urządzenia połączone. Zmiany synchronizują się automatycznie.';
  syncUi();
 }catch(e){
  syncInfo.textContent='Synchronizacja chwilowo niedostępna. Zmiany lokalne są zachowane i zostaną ponowione.';
 }finally{syncBusy=false}
}
async function connectSync(token,fromLink){
 if(syncConnecting)return false;
 syncConnecting=true;
 syncLink.disabled=true;
 try{
  const remote=await syncRequest({op:'join',token,hidden:[...hidden],saved:[...saved]});
  if(syncToken!==token){syncPending=[];storePending()}
  syncToken=token;
  localStorage.setItem(STORAGE_SYNC,token);
  applyRemote(remote);
  syncUi();
  syncInfo.textContent='Połączono. Teraz możesz korzystać z CR na obu urządzeniach.';
  if(fromLink)history.replaceState(null,'',location.pathname+location.search);
  return true;
 }catch(e){
  syncInfo.textContent='Nie udało się połączyć urządzeń. Spróbuj ponownie.';
  syncPanel.hidden=false;
  return false;
 }finally{syncConnecting=false;syncLink.disabled=false}
}
function makeSyncToken(){
 if(!crypto?.getRandomValues)throw Error('Bezpieczne parowanie wymaga HTTPS.');
 const bytes=new Uint8Array(32);crypto.getRandomValues(bytes);
 return Array.from(bytes,x=>x.toString(16).padStart(2,'0')).join('');
}
async function initializeSync(){
 const invite=new URLSearchParams(location.hash.slice(1)).get('cr-sync');
 if(invite&&SYNC_PATTERN.test(invite)){
  syncPanel.hidden=false;
  await connectSync(invite,true);
 }else if(syncToken){syncUi();await pullSync()}
 else syncUi();
}
syncLink.addEventListener('click',async function(){
 syncPanel.hidden=false;
 if(!syncToken){
  try{await connectSync(makeSyncToken(),false)}
  catch(e){syncInfo.textContent='Nie udało się utworzyć bezpiecznego linku.'}
 }else{syncUi();syncInfo.textContent='Otwórz ten link raz na drugim urządzeniu.'}
});
syncClose.addEventListener('click',function(){syncPanel.hidden=true});
syncCopy.addEventListener('click',function(){
 if(!syncInvite.value)return;
 if(navigator.clipboard?.writeText){
  navigator.clipboard.writeText(syncInvite.value)
   .then(function(){syncInfo.textContent='Link skopiowany. Otwórz go raz na Androidzie.'})
   .catch(function(){syncInvite.focus();syncInvite.select();syncInfo.textContent='Zaznaczony link możesz skopiować ręcznie.'});
 }else{syncInvite.focus();syncInvite.select();syncInfo.textContent='Zaznaczony link możesz skopiować ręcznie.'}
});
window.addEventListener('focus',function(){pullSync()});
document.addEventListener('visibilitychange',function(){if(!document.hidden)pullSync()});
setInterval(function(){if(!document.hidden)pullSync()},30000);

function readPrepared(){try{const v=JSON.parse(localStorage.getItem(STORAGE_PREPARED)||'{}');return v&&typeof v==='object'&&!Array.isArray(v)?v:{}}catch{return {}}}
function storePrepared(){try{localStorage.setItem(STORAGE_PREPARED,JSON.stringify(prepared));return true}catch{meta.textContent='Nie zapisano opisu w pamięci przeglądarki.';return false}}
function readSet(key){try{const x=JSON.parse(localStorage.getItem(key)||'[]');return new Set(Array.isArray(x)?x.map(String):[])}catch{return new Set()}}
function storeSet(key,set){try{localStorage.setItem(key,JSON.stringify([...set]));return true}catch{meta.textContent='Uwaga: przeglądarka nie zapisała tej zmiany na stałe.';return false}}
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c]})}
function link(url){try{const parsed=new URL(String(url));return parsed.protocol==='https:'?parsed.href:''}catch{return ''}}
function host(url){try{return new URL(url).hostname.replace(/^www[.]/,'')}catch{return 'Źródło'}}
function stamp(value){if(!value)return 'Data nieznana';const date=new Date(value);if(Number.isNaN(date.getTime()))return 'Data nieznana';return new Intl.DateTimeFormat('pl-PL',{timeZone:'Europe/Warsaw',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(date)}
function visibleArticles(){
 const query=search.value.trim().toLocaleLowerCase('pl');
 return articles.filter(function(a){
  const key=String(a.id);
  if(hidden.has(key)!==deletedView)return false;
  if(query&&!String(a.title||'').toLocaleLowerCase('pl').includes(query)&&!String(a.excerpt||'').toLocaleLowerCase('pl').includes(query))return false;
  return true;
 });
}
function card(a){
 const id=String(a.id),url=link(a.url),name=esc(a.title||'(Bez tytułu)'),isSaved=saved.has(id);
 const title=url?'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+name+'</a>':name;
 const date=stamp(a.published_at||a.first_seen_at);
 const discovered=stamp(a.first_seen_at);
 const intro=a.excerpt?'<p class="excerpt">'+esc(a.excerpt)+'</p>':'';
 const source=url?'<span>'+esc(host(url))+'</span>':'';
 const first='<article class="message"><div class="message-meta">'+source+'<span>Publikacja: '+esc(date)+'</span><span>W CR: '+esc(discovered)+'</span></div><h2>'+title+'</h2>'+intro+'<div class="actions">';
 const saveButton='<button type="button" class="action'+(isSaved?' saved':'')+'" data-action="save" data-id="'+esc(id)+'">'+(isSaved?'★ Zapisane':'☆ Zapisz')+'</button>';
 const hideButton='<button type="button" class="action" data-action="hide" data-id="'+esc(id)+'">'+(hidden.has(id)?'↶ Przywróć':'✕ Usuń z listy')+'</button>';
 const item=prepared[id];
 const prepButton='<button type="button" class="action prepare" data-action="prepare" data-id="'+esc(id)+'"'+(preparing.has(id)?' disabled':'')+'>'+(preparing.has(id)?'Przygotowuję…':item&&item.method!=='source_text_extract_v2'?'↻ Popraw opis':item?(expanded.has(id)?'✦ Zwiń opis':'✦ Pokaż opis'):'✦ Przygotuj')+'</button>';
 const err=prepareErrors[id]?'<div class="brief-error" role="alert">'+esc(prepareErrors[id])+'</div>':'';
 const queueButton='<button type="button" class="action prepare" data-action="queue-idea" data-id="'+esc(id)+'"'+(ideasQueueing.has(id)||ideasQueued.has(id)?' disabled':'')+'>'+(ideasQueued.has(id)?'✓ Przekazano do kreatora':ideasQueueing.has(id)?'Przekazuję…':'✦ Utwórz rolkę')+'</button>';
 const details=item&&expanded.has(id)?'<div class="brief"><div class="brief-head">'+queueButton+'</div><p>'+esc(item.description)+'</p><a class="brief-link" href="'+esc(link(item.source_url))+'" target="_blank" rel="noopener noreferrer">Źródło ↗</a><p><small>Opis roboczy z pełniejszej treści źródłowej (wybrane fragmenty, bez oceny AI). Sprawdź artykuł przed publikacją.</small></p></div>':'';
 return first+saveButton+hideButton+prepButton+'</div>'+err+details+'</article>';
}
function render(){
 const list=visibleArticles(),shown=list.slice(0,pageSize);
 messages.innerHTML=shown.length?shown.map(card).join(''):'<div class="empty">Brak wiadomości w tym widoku.</div>';
 meta.textContent='Wiadomości: '+articles.length+' · '+(deletedView?'usunięte: ':'na liście: ')+list.length+' · pokazano: '+shown.length;
 more.hidden=shown.length>=list.length;
 more.textContent='Pokaż kolejne ('+(list.length-shown.length)+')';
}
messages.addEventListener('click',async function(event){
 const b=event.target.closest('button[data-action]');if(!b)return;
 const id=String(b.dataset.id);if(!articles.some(function(a){return String(a.id)===id}))return;
 if(b.dataset.action==='hide'){
  if(hidden.has(id))hidden.delete(id);else hidden.add(id);
  storeSet(STORAGE_HIDDEN,hidden);
  enqueueSync('hidden',id,hidden.has(id));
 }else if(b.dataset.action==='save'){
  if(saved.has(id))saved.delete(id);else saved.add(id);
  storeSet(STORAGE_SAVED,saved);
  enqueueSync('saved',id,saved.has(id));
 }else if(b.dataset.action==='copy'){
  if(prepared[id]&&navigator.clipboard){navigator.clipboard.writeText(prepared[id].cr).catch(function(){prepareErrors[id]='Nie udało się skopiować numeru CR.';render()})}
  return;
 }else if(b.dataset.action==='copy-brief'){
  const entry=prepared[id],article=articles.find(a=>String(a.id)===id);
  if(entry&&article&&navigator.clipboard){
    const crLink=location.origin+'/api/cr?ref='+encodeURIComponent(entry.cr);
    const payload='Opracuj rolkę z materiału '+entry.cr
      +'\n\nTytuł: '+String(article.title||'')
      +'\n\nOpis na podstawie treści źródłowej:\n'+entry.description
      +'\n\nŹródło: '+entry.source_url
      +'\nKarta CR do odczytu w każdym wątku: '+crLink
      +'\n\nNumer nowego CR odnosi się do rekordu content_radar_discoveries, a nie do starej tabeli content_radar_items.';
    navigator.clipboard.writeText(payload).catch(function(){prepareErrors[id]='Nie udało się skopiować materiału do wątku.';render()});
  }
  return;
 }else if(b.dataset.action==='queue-idea'){
  if(ideasQueueing.has(id)||ideasQueued.has(id))return;
  const entry=prepared[id];
  if(!entry||typeof entry.description!=='string'||!link(entry.source_url)){
    prepareErrors[id]='Najpierw przygotuj materiał źródłowy.';
    render();return;
  }
  ideasQueueing.add(id);
  delete prepareErrors[id];
  render();
  try{
    const response=await fetch(IDEA_RPC,{
      method:'POST',
      headers:{apikey:IDEA_API_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({p_discovery_id:Number(id),p_description:entry.description}),
      signal:AbortSignal.timeout(15000)
    });
    if(!response.ok)throw new Error('HTTP '+response.status);
    const outcome=await response.json();
    if(outcome&&['created','exists'].includes(outcome.status))ideasQueued.add(id);
    else throw new Error('QUEUE_REJECTED');
  }catch(error){
    prepareErrors[id]='Nie udało się przekazać do kreatora. Spróbuj ponownie.';
  }finally{
    ideasQueueing.delete(id);
    render();
  }
  return;
 }else if(b.dataset.action==='prepare'){
  if(prepared[id]&&prepared[id].method==='source_text_extract_v2'){
    if(expanded.has(id))expanded.delete(id);else expanded.add(id);
  }else{
    if(preparing.has(id))return;
    preparing.add(id);delete prepareErrors[id];render();
    try{
      const response=await fetch('/api/prepare?id='+encodeURIComponent(id),{cache:'no-store'});
      const result=await response.json().catch(function(){return {}});
      if(!response.ok)throw new Error(result.error==='SOURCE_TEXT_UNAVAILABLE'||result.error==='SOURCE_TEXT_INSUFFICIENT'?'Brak wystarczającego tekstu artykułu. Nie przygotowuję opisu na podstawie samego tytułu.':'Nie udało się przygotować opisu ze źródła.');
      if(String(result.discovery_id)!==id||!result.cr||!result.description||!link(result.source_url))throw new Error('Niepełna odpowiedź źródła.');
      prepared[id]={cr:result.cr,description:result.description,source_url:result.source_url,method:result.method};
      storePrepared();expanded.add(id);
    }catch(error){prepareErrors[id]=error.message}
    finally{preparing.delete(id)}
  }
 }
 render();
});
deletedToggle.addEventListener('click',function(){
 deletedView=!deletedView;
 pageSize=80;
 deletedToggle.textContent=deletedView?'← Wiadomości':'Usunięte';
 deletedToggle.setAttribute('aria-pressed',String(deletedView));
 render();
});
search.addEventListener('input',function(){pageSize=80;render()});
more.addEventListener('click',function(){pageSize+=80;render()});
async function load(){
 if(fetching)return;
 fetching=true;
 try{
  const response=await fetch(API,{cache:'no-store'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const next=await response.json();
  if(!Array.isArray(next))throw new Error('Nieprawidłowy format danych');
  articles=next.filter(function(a){return a&&Number.isSafeInteger(Number(a.id))&&a.title&&a.url}).sort(function(a,b){return Date.parse(b.first_seen_at||0)-Date.parse(a.first_seen_at||0)});
  render();
 }catch(err){
  if(!articles.length)messages.innerHTML='<div class="error">Nie udało się wczytać wiadomości. Odśwież stronę.</div>';
  meta.textContent='Błąd odczytu wiadomości: '+err.message;
 }finally{fetching=false}
}
load();
initializeSync();
setInterval(function(){if(!document.hidden)load()},120000);

</script>
