<title>Źródła CR</title>
<style>
:root{color-scheme:dark;--bg:#0d1013;--card:#171b1f;--border:#31383d;--muted:#a2aaaf;--accent:#ffd700;--text:#f2f3f5;--danger:#ffb8b8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:1050px;margin:auto;padding:32px clamp(18px,4vw,48px) 90px}
h1{font-size:clamp(36px,5vw,64px);line-height:1.04;letter-spacing:-.05em;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:20px}
.top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn,.action,.link{display:inline-flex;gap:5px;align-items:center;justify-content:center;font:inherit;text-decoration:none;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:999px;padding:8px 13px;cursor:pointer}
.btn:hover,.action:hover,.link:hover{border-color:var(--accent)}
.btn.add{background:var(--accent);color:#161616;border-color:var(--accent);font-weight:750}
.source-search{display:block;width:min(100%,520px);margin-top:24px;padding:11px 16px;border:1px solid var(--border);border-radius:999px;background:#121619;color:var(--text);font:inherit}
.source-search:focus{outline:2px solid var(--accent);outline-offset:2px}
.url-edit{border:0;background:none;color:var(--accent);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:2px}
.url-edit:hover{color:#ffe981}
.url-form{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:12px;border-top:1px solid var(--border);padding-top:12px}
.url-form input{min-width:0;flex:1 1 190px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:#0d1013;color:var(--text);font:inherit;font-size:13px}
.url-form .action{font-size:12px;padding:7px 10px}
.url-form small{flex-basis:100%;font-size:11px;color:var(--muted)}
.url-error{flex-basis:100%;color:var(--danger);font-size:12px}
.meta{margin-top:22px;margin-bottom:14px;color:var(--muted);font-size:13px;min-height:22px}
.category{border-top:1px solid var(--border)}
.category summary{display:flex;align-items:center;justify-content:space-between;gap:15px;cursor:pointer;padding:18px 0;list-style:none}
.category summary::-webkit-details-marker{display:none}
.category h2{font-size:19px;line-height:1.3;margin:0;letter-spacing:-.02em}
.count{font-size:13px;color:var(--muted);white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;padding:0 0 20px}
.source{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px;min-width:0}
.source.off{opacity:.55}
.source-name{font-weight:750;font-size:16px;line-height:1.3;margin-bottom:10px;overflow-wrap:anywhere}
.source-details{display:flex;align-items:center;flex-wrap:wrap;gap:6px;color:var(--muted);font-size:12px}
.pill{display:inline-flex;border:1px solid var(--border);border-radius:999px;padding:3px 8px;line-height:1.3}
.status{color:#bec8cf;border-color:#465259}
.status.live{color:#aee5bd;border-color:#416a50}
.status.failed{color:#f4c399;border-color:#936c4e}
.source-details a{color:#ced5da}
.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.controls .action,.controls select{font-size:12px;padding:7px 10px}
.controls select{border:1px solid var(--border);border-radius:999px;background:#101417;color:var(--text)}
.controls .remove{color:var(--danger);border-color:#654141}
.small{font-size:11px;color:var(--muted);margin-top:7px}
.error,.empty{border-top:1px solid var(--border);padding:30px 0;color:var(--muted)}
.error{color:var(--danger)}
dialog{border:1px solid var(--border);background:#13171b;color:var(--text);border-radius:20px;padding:0;width:min(640px,calc(100vw - 24px))}
dialog::backdrop{background:#000b}
.form-head{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);padding:20px 24px}
.form-head h2{margin:0;font-size:25px}
form{padding:20px 24px 24px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;font:inherit;color:var(--text);border:1px solid var(--border);border-radius:10px;background:#0d1013;padding:10px}
.field textarea{min-height:75px;resize:vertical}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.form-status{font-size:13px;min-height:20px;margin-top:10px;color:var(--muted)}
@media(max-width:700px){.top{align-items:flex-start}.top-actions{gap:7px}.top-actions .btn{font-size:12px}.cards{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.form-head{padding:18px}.form-head h2{font-size:21px}form{padding:18px}}
</style>
</head>
<body>
<main>
<header class="top">
  <h1>Źródła CR<span style="color:var(--accent)">.</span></h1>
  <nav class="top-actions" aria-label="Nawigacja">
    <a class="btn" href="/">← Content Radar</a>
    <button class="btn add" type="button" id="add">+ Dodaj źródło</button>
  </nav>
</header>
<input id="sourceSearch" class="source-search" type="search" autocomplete="off" aria-label="Szukaj źródeł" placeholder="Szukaj źródła po nazwie lub adresie…">
<div id="meta" class="meta" role="status">Ładowanie źródeł…</div>
<section id="groups" aria-label="Lista źródeł"></section>
</main>
<dialog id="sourceDialog" aria-label="Dodaj źródło">
  <div class="form-head"><h2>Dodaj źródło do CR</h2><button type="button" class="action" id="close" aria-label="Zamknij">×</button></div>
  <form id="sourceForm">
    <div class="fields">
      <div class="field full"><label for="name">Nazwa źródła</label><input id="name" name="name" maxlength="180" required placeholder="Nazwa źródła"></div>
      <div class="field full"><label for="url">Adres URL</label><input id="url" name="url" type="url" required placeholder="https://..."></div>
      <div class="field"><label for="category">Kategoria</label><select id="category" name="category">
        <option>Oficjalne, prawo i administracja</option><option>Dane, raporty, trendy i finansowanie</option>
        <option>Organizacje przedsiębiorców i branże</option><option>Media gospodarcze, prawne i biznesowe</option>
        <option>Konkurencja / obserwacja rynku księgowości</option><option>Social, dyskusje i sygnały intencji</option>
        <option selected>Inne</option>
      </select></div>
      <div class="field"><label for="source_type">Typ</label><select id="source_type" name="source_type">
        <option value="youtube">YouTube</option><option value="official">Oficjalne</option>
        <option value="media">Media</option><option value="data">Dane / raport</option>
        <option value="expert">Ekspert / kancelaria</option><option value="social">Social</option>
        <option value="organization">Organizacja</option><option value="competitor">Konkurencja</option>
        <option value="trend">Trend</option><option value="intent">Sygnał intencji</option>
        <option value="website" selected>Serwis WWW</option>
      </select></div>
      <div class="field"><label for="priority">Priorytet</label><select id="priority" name="priority">
        <option value="5">5 — bardzo wysoki</option><option value="4">4 — wysoki</option>
        <option value="3" selected>3 — normalny</option><option value="2">2 — niski</option>
        <option value="1">1 — eksperymentalny</option>
      </select></div>
      <div class="field"><label for="notes">Notatka</label><textarea id="notes" name="notes" placeholder="Opcjonalnie"></textarea></div>
    </div>
    <div id="formStatus" class="form-status" role="status"></div>
    <div class="form-actions"><button type="button" id="cancel" class="btn">Anuluj</button><button type="submit" id="submit" class="btn add">Dodaj do CR</button></div>
  </form>
</dialog>

<script>
'use strict';
const API='https://oxpvuxxcskqggfqgefzg.supabase.co/functions/v1/content-radar-sources';
const LEGACY_PROFILES=['accounting','bizgenerator'];
const groups=document.querySelector('#groups'),meta=document.querySelector('#meta'),
 dialog=document.querySelector('#sourceDialog'),form=document.querySelector('#sourceForm'),
 formStatus=document.querySelector('#formStatus'),submit=document.querySelector('#submit'),
 sourceSearch=document.querySelector('#sourceSearch');
let sources=[],editingUrlId=null,urlError='';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safeUrl(raw){try{const u=new URL(raw);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}
function normalizeUrl(value){
 const raw=String(value||'').trim();
 if(!raw||raw.length>2048)throw Error('Podaj adres URL o długości do 2048 znaków.');
 if(/^[a-z][a-z\d+.-]*:/i.test(raw)&&!/^https?:\/\//i.test(raw))
   throw Error('Dozwolone są wyłącznie adresy HTTP/HTTPS.');
 const completed=/^https?:\/\//i.test(raw)?raw:'https://'+raw;
 let parsed;
 try{parsed=new URL(completed)}catch{throw Error('Podaj poprawny adres, np. https://example.pl.')}
 if(!['https:','http:'].includes(parsed.protocol)||!parsed.hostname||parsed.username||parsed.password)
  throw Error('Dozwolone są wyłącznie zwykłe adresy HTTP/HTTPS.');
 return parsed.href;
}
function priorityOptions(current){return [5,4,3,2,1].map(v=>'<option value="'+v+'"'+(Number(current)===v?' selected':'')+'>P'+v+'</option>').join('')}
function liveCollector(c){
 const data=c||{};
 return !!data.collector_enabled&&!!data.last_success_at&&['READABLE','NO_NEW_CONTENT'].includes(data.latest_status);
}
function collectorLabel(c){
 const status=c||{};
 const isLive=liveCollector(status),connected=!!status.collector_enabled;
 const label=isLive?'MONITOROWANE':connected?'WYMAGA SPRAWDZENIA':status.adapter?'ADAPTER NIEAKTYWNY':'NIEPODŁĄCZONE';
 const color=isLive?'live':connected||status.adapter?'failed':'';
 const recent=status.last_success_at?new Date(status.last_success_at).toLocaleString('pl-PL',{dateStyle:'short',timeStyle:'short'}):null;
 return '<span class="pill status '+color+'">'+label+'</span>'+(recent?'<span class="small">Odczyt: '+esc(recent)+'</span>':'');
}
function mergeProfiles(profiles){
 const joined=new Map();
 for(const [profileKey,items] of profiles){
   for(const s of items){
     if(!s||!s.id)continue;
     const prev=joined.get(s.id);
     if(!prev){
       joined.set(s.id,{...s,active:!!s.active,priority:Number(s.priority)||3,
         memberships:[profileKey],collector:s.collector||{}});
       continue;
     }
     prev.active=prev.active||!!s.active;
     prev.priority=Math.max(prev.priority,Number(s.priority)||1);
     if(!prev.memberships.includes(profileKey))prev.memberships.push(profileKey);
     const prevC=prev.collector||{},nowC=s.collector||{};
     if(!liveCollector(prevC)&&liveCollector(nowC))prev.collector=nowC;
     else if(!prevC.collector_enabled&&nowC.collector_enabled)prev.collector=nowC;
   }
 }
 return [...joined.values()].sort((a,b)=>
   String(a.category||'Inne').localeCompare(String(b.category||'Inne'),'pl')
   ||Number(b.priority)-Number(a.priority)||String(a.name).localeCompare(String(b.name),'pl'));
}
function renderCard(s){
 const url=safeUrl(s.url);
 const isEditing=editingUrlId===s.id;
 const editForm=isEditing
  ?'<form class="url-form" data-url-form="'+esc(s.id)+'" novalidate>'
   +'<input name="url" type="text" inputmode="url" aria-label="Adres URL dla '+esc(s.name)+'" placeholder="https://twoje-zrodlo.pl" value="'+esc(url)+'" required maxlength="2048">'
   +'<button type="submit" class="action" data-save-url="'+esc(s.id)+'">Zapisz URL</button>'
   +'<button type="button" class="action" data-cancel-url="'+esc(s.id)+'">Anuluj</button>'
   +(urlError?'<span class="url-error" role="alert">'+esc(urlError)+'</span>':'')
   +'<small>Wpisanie URL nie uruchamia automatycznie monitorowania. Status kolektora pozostaje bez zmian.</small>'
   +'</form>'
  :'';
 return '<article class="source'+(s.active?'':' off')+'" data-id="'+esc(s.id)+'">'
   +'<div class="source-name">'+esc(s.name)+'</div>'
   +'<div class="source-details"><span class="pill">'+esc(s.source_type||'WWW')+'</span>'
   +(url?'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Otwórz źródło ↗</a>':'<span>Brak URL</span>')
   +'<button type="button" class="url-edit" data-edit-url="'+esc(s.id)+'">'+(url?'Zmień URL':'+ Dodaj URL')+'</button>'
   +collectorLabel(s.collector)+'</div>'
   +editForm
   +'<div class="controls">'
   +'<select aria-label="Priorytet '+esc(s.name)+'" data-priority="'+esc(s.id)+'">'+priorityOptions(s.priority)+'</select>'
   +'<button type="button" class="action" data-toggle="'+esc(s.id)+'">'+(s.active?'AKTYWNE':'WYŁĄCZONE')+'</button>'
   +'<button type="button" class="action remove" data-remove="'+esc(s.id)+'">USUŃ</button>'
   +'</div></article>';
}
function render(){
 const categorized=new Map();
 const query=sourceSearch.value.trim().toLocaleLowerCase('pl');
 const shown=sources.filter(source=>!query||[source.name,source.url,source.category].some(value=>String(value||'').toLocaleLowerCase('pl').includes(query)));
 for(const source of shown){
   const key=source.category||'Inne';
   if(!categorized.has(key))categorized.set(key,[]);
   categorized.get(key).push(source);
 }
 const monitored=sources.filter(s=>liveCollector(s.collector)).length;
 const missing=sources.filter(s=>!safeUrl(s.url)).length;
 meta.textContent=sources.length+' źródeł CR · '+missing+' bez URL · '+monitored+' z potwierdzonym odczytem'+(query?' · znaleziono: '+shown.length:'');
 groups.innerHTML=categorized.size?[...categorized.entries()].map(([category,rows])=>
  '<details class="category" open><summary><h2>'+esc(category)+'</h2><span class="count">'+rows.length+'</span></summary>'
  +'<div class="cards">'+rows.map(renderCard).join('')+'</div></details>').join('')
  :'<div class="empty">'+(query?'Nie znaleziono pasujących źródeł.':'Brak źródeł. Dodaj pierwsze źródło.')+'</div>';
}
async function callApi(method,body,profile){
 const url=API+(profile?'?profile_key='+encodeURIComponent(profile):'');
 const r=await fetch(url,{method,cache:'no-store',headers:body?{'Content-Type':'application/json'}:undefined,body:body?JSON.stringify(body):undefined});
 const data=await r.json().catch(()=>({}));
 if(!r.ok||!data.ok)throw Error(data.error||'HTTP '+r.status);
 return data;
}
async function load(){
 meta.textContent='Ładowanie źródeł…';
 try{
   const [a,b]=await Promise.all(LEGACY_PROFILES.map(p=>callApi('GET',null,p)));
   sources=mergeProfiles([['accounting',a.sources||[]],['bizgenerator',b.sources||[]]]);
   render();
 }catch(e){
   meta.textContent='Nie udało się wczytać źródeł';
   groups.innerHTML='<div class="error">Błąd odczytu: '+esc(e.message)+'</div>';
 }
}
async function updateAssignments(s,patch,method='PATCH'){
 // All mutations are explicitly requested by the user. Legacy profile rows remain as-is until clicking.
 let updated=0;
 try{
   for(const profile of s.memberships){
     await callApi(method,{id:s.id,profile_key:profile,...patch});
     updated++;
   }
 }catch(e){
   await load();
   throw Error('Niepełna operacja ('+updated+'/'+s.memberships.length+'): '+e.message+'. Sprawdź stan źródła.');
 }
 await load();
}
sourceSearch.addEventListener('input',render);
groups.addEventListener('click',e=>{
 const btn=e.target.closest('button[data-edit-url],button[data-cancel-url]');
 if(!btn)return;
 if(btn.dataset.editUrl){
   editingUrlId=btn.dataset.editUrl;
   urlError='';
   render();
   const input=groups.querySelector('.url-form[data-url-form="'+editingUrlId+'"] input');
   if(input)input.focus();
 }else{
   editingUrlId=null;
   urlError='';
   render();
 }
});
groups.addEventListener('submit',async e=>{
 const form=e.target.closest('form[data-url-form]');
 if(!form)return;
 e.preventDefault();
 const id=form.dataset.urlForm,source=sources.find(item=>item.id===id);
 if(!source)return;
 const input=form.querySelector('input[name="url"]');
 let normalized;
 try{normalized=normalizeUrl(input.value)}catch(error){
   urlError=error.message;
   const errorEl=form.querySelector('.url-error');
   if(errorEl)errorEl.textContent=urlError;
   else {
     const message=document.createElement('span');
     message.className='url-error';
     message.setAttribute('role','alert');
     message.textContent=urlError;
     form.appendChild(message);
   }
   return;
 }
 const submitButton=form.querySelector('button[type="submit"]');
 submitButton.disabled=true;submitButton.textContent='Zapisuję…';
 try{
   // The existing catalog-level PATCH edits only the URL, leaving legacy profile memberships,
   // priorities, collector configuration and activity untouched.
   const result=await callApi('PATCH',{id,url:normalized});
   if(!result.source||safeUrl(result.source.url)!==normalized)
     throw Error('Serwer nie potwierdził zapisu adresu.');
   editingUrlId=null;
   urlError='';
   await load();
 }catch(error){
   urlError='Nie udało się zapisać URL: '+error.message;
   let message=form.querySelector('.url-error');
   if(!message){message=document.createElement('span');message.className='url-error';message.setAttribute('role','alert');form.appendChild(message)}
   message.textContent=urlError;
 }finally{submitButton.disabled=false;submitButton.textContent='Zapisz URL'}
});
groups.addEventListener('click',async e=>{
 const btn=e.target.closest('button[data-toggle],button[data-remove]');
 if(!btn)return;
 const id=btn.dataset.toggle||btn.dataset.remove,s=sources.find(x=>x.id===id);
 if(!s)return;
 if(btn.dataset.remove){
   if(!confirm('Usunąć „'+s.name+'” z CR? Zostaną usunięte jego przypisania do obu dotychczasowych profili. Kolektor może przestać je monitorować.'))return;
   btn.disabled=true;
   try{await updateAssignments(s,{},'DELETE')}catch(e){alert(e.message)}
 }else{
   const next=!s.active;
   if(!next&&!confirm('Wyłączyć monitorowanie „'+s.name+'” w całym CR?'))return;
   btn.disabled=true;
   try{await updateAssignments(s,{active:next})}catch(e){alert(e.message)}
 }
});
groups.addEventListener('change',async e=>{
 const sel=e.target.closest('select[data-priority]');
 if(!sel)return;
 const s=sources.find(x=>x.id===sel.dataset.priority);
 if(!s)return;
 sel.disabled=true;
 try{await updateAssignments(s,{priority:Number(sel.value)})}catch(err){alert(err.message)}
});
document.querySelector('#add').addEventListener('click',()=>{
 form.reset();formStatus.textContent='';dialog.showModal();
});
document.querySelector('#close').addEventListener('click',()=>dialog.close());
document.querySelector('#cancel').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
form.addEventListener('submit',async e=>{
 e.preventDefault();submit.disabled=true;formStatus.textContent='Dodawanie…';
 const values=Object.fromEntries(new FormData(form).entries());
 const data={...values,priority:Number(values.priority),profile_keys:[...LEGACY_PROFILES]};
 try{
   await callApi('POST',data);
   await load();
   dialog.close();
 }catch(error){
   formStatus.textContent='Nie udało się dodać źródła: '+error.message;
 }finally{submit.disabled=false}
});
load();
</script>
</body></html>
